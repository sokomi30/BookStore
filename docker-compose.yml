version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: bookstore_db
    environment:
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: bookstore123
      POSTGRES_DB: bookstore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bookstore_cache
    ports:
      - "6379:6379"

  webapi:
    build:
      context: .
      dockerfile: BookStore.WebApi/Dockerfile
    container_name: bookstore_api
    ports:
      - "5000:8080"
    volumes:
      - covers_data:/app/wwwroot/covers
    environment:
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=bookstore;Username=bookstore;Password=bookstore123
      - JWT__Key=${JWT_KEY:-YourSuperSecretKeyThatIsAtLeast32CharactersLong!}
      - JWT__Issuer=BookStoreApi
      - JWT__Audience=BookStoreClient
      - Redis__ConnectionString=redis:6379
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./BookStore.Web
      dockerfile: Dockerfile
    container_name: bookstore_frontend
    ports:
      - "3000:80"
    depends_on:
      - webapi

volumes:
  postgres_data:
  covers_data: